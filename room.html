<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Room &mdash; StyleMyShack</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>

  <header class="site-header">
    <div class="container">
      <a href="index.html" class="header-back">&#8592; All Rooms</a>
      <span class="logo">Style<span>MyShack</span></span>
    </div>
  </header>

  <section class="page-hero">
    <div class="container">
      <h1 id="room-title">Room</h1>
      <p id="room-description"></p>
    </div>
  </section>

  <!-- Room Navigation Strip -->
  <div class="room-nav-strip-wrap">
    <div class="container">
      <div class="room-nav-strip" id="room-nav">
        <!-- Populated by room.js -->
      </div>
    </div>
  </div>

  <main>
    <div class="room-detail">
      <div class="container">
        <div class="room-detail-grid">

          <!-- Photo Panel -->
          <div class="photo-panel">
            <div class="photo-tabs">
              <button class="photo-tab active" data-tab="actual">Actual Photos</button>
              <button class="photo-tab" data-tab="model3d">3D Model</button>
              <button class="photo-tab" data-tab="floorPlan">Floor Plan</button>
              <button class="photo-tab" data-tab="inspiration">Inspiration</button>
            </div>

            <div class="photo-content active" id="tab-actual">
              <div id="gallery-actual"></div>
              <div class="photo-upload-wrap" id="upload-wrap-actual" style="display:none">
                <label class="photo-upload-btn" for="upload-actual">
                  + Add Photos
                  <input type="file" id="upload-actual" accept="image/*" multiple
                         data-tab="actual" class="photo-file-input" />
                </label>
              </div>
            </div>

            <div class="photo-content" id="tab-model3d">
              <div id="gallery-model3d"></div>
              <div class="photo-upload-wrap" id="upload-wrap-model3d" style="display:none">
                <label class="photo-upload-btn" for="upload-model3d">
                  + Add 3D Model Photos
                  <input type="file" id="upload-model3d" accept="image/*" multiple
                         data-tab="model3d" class="photo-file-input" />
                </label>
              </div>
            </div>

            <div class="photo-content" id="tab-floorPlan">
              <div id="gallery-floorPlan"></div>
              <div class="photo-upload-wrap" id="upload-wrap-floorPlan" style="display:none">
                <label class="photo-upload-btn" for="upload-floorPlan">
                  + Add Floor Plan
                  <input type="file" id="upload-floorPlan" accept="image/*" multiple
                         data-tab="floorPlan" class="photo-file-input" />
                </label>
              </div>
            </div>

            <div class="photo-content" id="tab-inspiration">
              <div id="gallery-inspiration"></div>
              <div class="photo-upload-wrap" id="upload-wrap-inspiration" style="display:none">
                <label class="photo-upload-btn" for="upload-inspiration">
                  + Add Inspiration Photos
                  <input type="file" id="upload-inspiration" accept="image/*" multiple
                         data-tab="inspiration" class="photo-file-input" />
                </label>
              </div>
            </div>
          </div>

          <!-- Recommendations Panel -->
          <div class="rec-panel">
            <div class="rec-panel-header">
              <h2>Designer Recommendations</h2>
              <button class="edit-toggle-btn" id="edit-toggle">Edit</button>
            </div>

            <div class="rec-body" id="rec-body">
              <!-- Populated by room.js -->
            </div>
          </div>

        </div>

        <!-- Thread / Messages -->
        <div class="thread-section">
          <button class="thread-toggle" id="thread-toggle">
            <span class="thread-arrow" id="thread-arrow">&#9654;</span>
            Messages
            <span class="thread-count" id="thread-count"></span>
          </button>
          <div class="thread-body" id="thread-body">
            <div id="messages-list"></div>
            <div class="draft-indicator" id="draft-indicator" style="display:none"></div>
            <div class="thread-compose">
              <textarea id="compose-area" placeholder="Write a message…"></textarea>
              <button class="btn-primary-small" id="send-btn">Send</button>
            </div>
          </div>
        </div>

      </div>
    </div>
  </main>

  <footer class="site-footer">
    <p>StyleMyShack &mdash; Interior design, room by room.</p>
  </footer>

  <!-- Save Banner -->
  <div class="save-banner" id="save-banner"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase.js"></script>
  <script src="js/room.js"></script>
</body>
</html>
