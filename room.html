<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Room &mdash; StyleMyShack</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>

  <header class="site-header">
    <div class="container">
      <a href="index.html" class="header-back">&#8592; All Rooms</a>
      <a href="index.html" class="logo">Style<span>MyShack</span></a>
      <a href="gallery.html" class="header-nav-link">Gallery</a>
    </div>
  </header>

  <section class="page-hero">
    <div class="container">
      <h1 id="room-title">Room</h1>
      <p id="room-description"></p>
    </div>
  </section>

  <!-- Room Navigation Strip -->
  <div class="room-nav-strip-wrap">
    <div class="container">
      <div class="room-nav-strip" id="room-nav">
        <!-- Populated by room.js -->
      </div>
    </div>
  </div>

  <section class="owner-brief-section">
    <div class="container">
      <div class="owner-brief-block">
        <div class="owner-brief-label">Owner's Brief</div>
        <div class="owner-brief-text" id="owner-notes-text" data-placeholder="What are you looking for in this room? Click to add notes for the designer…"></div>
      </div>
    </div>
  </section>

  <main>
    <div class="room-detail">
      <div class="container">
        <div class="room-detail-grid">

          <!-- Photo Panel -->
          <div class="photo-panel">
            <div class="photo-tabs">
              <button class="photo-tab active" data-tab="actual">Actual Photos</button>
              <button class="photo-tab" data-tab="model3d">3D Model</button>
              <button class="photo-tab" data-tab="floorPlan">Floor Plan</button>
              <button class="photo-tab" data-tab="inspiration">Inspiration</button>
            </div>

            <div class="photo-content active" id="tab-actual">
              <div id="gallery-actual"></div>
              <div class="photo-upload-wrap" id="upload-wrap-actual" style="display:none">
                <label class="photo-upload-btn" for="upload-actual">
                  + Add Photos
                  <input type="file" id="upload-actual" accept="image/*" multiple
                         data-tab="actual" class="photo-file-input" />
                </label>
                <button class="from-gallery-btn" data-tab="actual" type="button">From gallery</button>
              </div>
            </div>

            <div class="photo-content" id="tab-model3d">
              <div id="gallery-model3d"></div>
              <div class="photo-upload-wrap" id="upload-wrap-model3d" style="display:none">
                <label class="photo-upload-btn" for="upload-model3d">
                  + Add 3D Model Photos
                  <input type="file" id="upload-model3d" accept="image/*" multiple
                         data-tab="model3d" class="photo-file-input" />
                </label>
                <button class="from-gallery-btn" data-tab="model3d" type="button">From gallery</button>
              </div>
            </div>

            <div class="photo-content" id="tab-floorPlan">
              <div id="gallery-floorPlan"></div>
              <div class="photo-upload-wrap" id="upload-wrap-floorPlan" style="display:none">
                <label class="photo-upload-btn" for="upload-floorPlan">
                  + Add Floor Plan
                  <input type="file" id="upload-floorPlan" accept="image/*" multiple
                         data-tab="floorPlan" class="photo-file-input" />
                </label>
                <button class="from-gallery-btn" data-tab="floorPlan" type="button">From gallery</button>
              </div>
            </div>

            <div class="photo-content" id="tab-inspiration">
              <div id="gallery-inspiration"></div>
              <div class="photo-upload-wrap" id="upload-wrap-inspiration" style="display:none">
                <label class="photo-upload-btn" for="upload-inspiration">
                  + Add Inspiration Photos
                  <input type="file" id="upload-inspiration" accept="image/*" multiple
                         data-tab="inspiration" class="photo-file-input" />
                </label>
                <button class="from-gallery-btn" data-tab="inspiration" type="button">From gallery</button>
              </div>
            </div>
          </div>

          <!-- Recommendations Panel -->
          <div class="rec-panel">
            <div class="rec-panel-header">
              <h2>Design Notes</h2>
              <button class="edit-toggle-btn" id="edit-toggle">Edit</button>
            </div>

            <div class="rec-body" id="rec-body">
              <!-- Populated by room.js -->
            </div>
          </div>

        </div>

        <!-- Public Comments -->
        <div class="comments-section" id="room-comments-section">
          <h3 class="comments-title">Comments</h3>
          <div class="comments-list" id="room-comments-list"></div>
          <div class="comments-compose" id="room-comments-compose"></div>
        </div>

        <!-- Builder Updates -->
        <div class="builder-updates-section" id="builder-updates-section" style="display:none">
          <div class="builder-updates-header">
            <h3 class="builder-updates-title">Builder Updates</h3>
            <button class="btn-primary-small" id="add-builder-update-btn" style="display:none">+ Add Update</button>
          </div>
          <div class="builder-updates-feed" id="builder-updates-feed">
            <!-- populated by room.js -->
          </div>
        </div>

        <!-- Thread / Messages -->
        <div class="thread-section">
          <button class="thread-toggle" id="thread-toggle">
            <span class="thread-arrow" id="thread-arrow">&#9654;</span>
            Messages
            <span class="thread-count" id="thread-count"></span>
          </button>
          <div class="thread-body" id="thread-body">
            <div id="messages-list"></div>
            <div class="draft-indicator" id="draft-indicator" style="display:none"></div>
            <div class="thread-compose">
              <textarea id="compose-area" placeholder="Write a message…"></textarea>
              <button class="btn-primary-small" id="send-btn">Send</button>
            </div>
          </div>
        </div>

      </div>
    </div>
  </main>

  <footer class="site-footer">
    <p>StyleMyShack &mdash; Interior design, room by room.</p>
  </footer>

  <!-- Save Banner -->
  <div class="save-banner" id="save-banner"></div>

  <nav class="mobile-tab-bar" aria-label="Navigate">
    <a href="index.html" class="mtb-tab">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/>
        <polyline points="9 22 9 12 15 12 15 22"/>
      </svg>
      <span>Home</span>
    </a>
    <a href="gallery.html" class="mtb-tab">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/>
        <rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/>
      </svg>
      <span>Gallery</span>
    </a>
  </nav>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/gallery-picker.js"></script>
  <script src="js/room.js"></script>
  <script>
    /* Keep --header-h in sync so the sticky room strip sits flush below the header. */
    (function () {
      var h = document.querySelector('.site-header');
      if (!h) return;
      function set() { document.documentElement.style.setProperty('--header-h', h.offsetHeight + 'px'); }
      set();
      if (window.ResizeObserver) new ResizeObserver(set).observe(h);
    })();
  </script>
</body>
</html>
