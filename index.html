<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>StyleMyShack</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>

  <header class="site-header">
    <div class="container">
      <a href="index.html" class="logo">Style<span>MyShack</span></a>
      <a href="gallery.html" class="header-nav-link">Gallery</a>
    </div>
  </header>

  <section class="page-hero">
    <div class="container">
      <h1 id="cabin-name">My Cabin</h1>
      <p>Interior design recommendations by room</p>
    </div>
  </section>

  <section class="home-carousel-section">
    <div class="container">
      <div class="home-carousel-wrap" id="home-carousel-wrap">
        <div class="home-carousel-slide active">
          <div class="home-carousel-empty">
            <div class="home-carousel-empty-icon">📷</div>
            <p>Loading…</p>
          </div>
        </div>
      </div>
      <div class="home-carousel-bar">
        <div class="home-carousel-dots" id="home-carousel-dots"></div>
        <span class="home-carousel-counter" id="home-carousel-counter"></span>
        <label class="home-carousel-upload" for="site-photo-upload">+ Add photos
          <input type="file" id="site-photo-upload" accept="image/*" multiple class="hidden-input" />
        </label>
        <button type="button" class="from-gallery-btn" id="carousel-from-gallery-btn">From gallery</button>
      </div>
    </div>
  </section>

  <section class="owner-brief-section">
    <div class="container">
      <div class="owner-brief-block">
        <div class="owner-brief-label">Project Summary</div>
        <div class="owner-brief-text" id="owner-notes-text" data-placeholder="Add a project overview…"></div>
      </div>

      <!-- Owner-only private journal — hidden from all other roles -->
      <div class="owner-journal-block" id="owner-journal-block" style="display:none">
        <div class="owner-journal-header">
          <div class="owner-brief-label">Project Updates</div>
          <button class="owner-journal-add-btn" id="owner-journal-add-btn">+ Add Entry</button>
        </div>
        <div class="owner-journal-compose" id="owner-journal-compose" style="display:none">
          <div class="owner-journal-date" id="owner-journal-date"></div>
          <textarea class="owner-journal-textarea" id="owner-journal-text" placeholder="What's the update?" rows="3"></textarea>
          <div class="owner-journal-compose-btns">
            <button class="auth-btn-secondary" id="owner-journal-cancel">Cancel</button>
            <button class="btn-primary-small" id="owner-journal-save">Save Entry</button>
          </div>
        </div>
        <div class="owner-journal-feed" id="owner-journal-feed"></div>
      </div>
    </div>
  </section>

  <main>
    <section class="rooms-section">
      <div class="container">
        <h2>Rooms</h2>
        <div class="room-grid" id="room-grid">
          <!-- Room cards injected by main.js -->
        </div>
        <p class="rooms-empty" id="rooms-empty" style="display:none;">No rooms found. Run schema.sql in Supabase to seed the data.</p>
      </div>
    </section>
  </main>

  <!-- What's New -->
  <section class="whats-new-section">
    <div class="container">
      <h2 class="whats-new-title">What's New</h2>
      <div class="whats-new-list" id="whats-new-list"></div>
    </div>
  </section>

  <!-- Public Comments -->
  <section class="comments-section-home">
    <div class="container">
      <h2 class="comments-home-title">Comments</h2>
      <div class="comments-list" id="home-comments-list"></div>
      <div class="comments-compose" id="home-comments-compose"></div>
    </div>
  </section>

  <!-- Builder Updates (owner + builder only, populated by main.js) -->
  <section class="home-builder-updates-section" id="home-builder-updates-section" style="display:none">
    <div class="container">
      <div class="builder-updates-header">
        <h2 class="home-builder-updates-title">Construction Updates</h2>
        <button class="btn-primary-small" id="home-add-builder-update-btn" style="display:none">+ Add Update</button>
      </div>
      <div class="builder-updates-feed" id="home-builder-updates-feed"></div>
    </div>
  </section>

  <footer class="site-footer">
    <p>StyleMyShack &mdash; Interior design, room by room.</p>
  </footer>

  <div class="save-banner" id="save-banner"></div>

  <nav class="mobile-tab-bar" aria-label="Navigate">
    <a href="index.html" class="mtb-tab mtb-active">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/>
        <polyline points="9 22 9 12 15 12 15 22"/>
      </svg>
      <span>Home</span>
    </a>
    <a href="gallery.html" class="mtb-tab">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/>
        <rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/>
      </svg>
      <span>Gallery</span>
    </a>
  </nav>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/gallery-picker.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
