<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>StyleMyShack</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>

  <header class="site-header">
    <div class="container">
      <span class="logo">Style<span>MyShack</span></span>
    </div>
  </header>

  <section class="page-hero">
    <div class="container">
      <h1 id="cabin-name">My Cabin</h1>
      <p>Interior design recommendations by room</p>
    </div>
  </section>

  <main>
    <section class="rooms-section">
      <div class="container">
        <h2>Rooms</h2>
        <div class="room-grid" id="room-grid">
          <!-- Room cards injected by main.js -->
        </div>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <p>StyleMyShack &mdash; Interior design, room by room.</p>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
