<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>StyleMyShack</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>

  <header class="site-header">
    <div class="container">
      <a href="index.html" class="logo">Style<span>MyShack</span></a>
    </div>
  </header>

  <section class="page-hero">
    <div class="container">
      <h1 id="cabin-name">My Cabin</h1>
      <p>Interior design recommendations by room</p>
    </div>
  </section>

  <section class="home-carousel-section">
    <div class="container">
      <div class="home-carousel-wrap" id="home-carousel-wrap">
        <div class="home-carousel-slide active">
          <div class="home-carousel-empty">
            <div class="home-carousel-empty-icon">📷</div>
            <p>Loading…</p>
          </div>
        </div>
      </div>
      <div class="home-carousel-bar">
        <div class="home-carousel-dots" id="home-carousel-dots"></div>
        <span class="home-carousel-counter" id="home-carousel-counter"></span>
        <label class="home-carousel-upload" for="site-photo-upload">+ Add photos
          <input type="file" id="site-photo-upload" accept="image/*" multiple class="hidden-input" />
        </label>
      </div>
    </div>
  </section>

  <section class="owner-brief-section">
    <div class="container">
      <div class="owner-brief-block">
        <div class="owner-brief-label">Owner's Brief</div>
        <div class="owner-brief-text" id="owner-notes-text" data-placeholder="What are you looking for? Click to add notes for the designer…"></div>
      </div>
    </div>
  </section>

  <main>
    <section class="rooms-section">
      <div class="container">
        <h2>Rooms</h2>
        <div class="room-grid" id="room-grid">
          <!-- Room cards injected by main.js -->
        </div>
        <p class="rooms-empty" id="rooms-empty" style="display:none;">No rooms found. Run schema.sql in Supabase to seed the data.</p>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <p>StyleMyShack &mdash; Interior design, room by room.</p>
  </footer>

  <div class="save-banner" id="save-banner"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
